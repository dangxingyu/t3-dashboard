name: Publish T3 dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage only public website files
        run: |
          mkdir _site
          cp index.html style.css app.js data.json .nojekyll complete56-development.pdf complete56-external.pdf complete56-external.png \
            replay-own-zero.pdf replay-own-zero.png replay-trajectories.pdf replay-trajectories.png \
            small-radius-effects.pdf small-radius-effects.png small-radius-trajectories.pdf small-radius-trajectories.png \
            all96-learning-forgetting.pdf all96-learning-forgetting.png all48-strict-retention-effects.pdf all48-strict-retention-effects.png \
            focus-direction-retention.pdf focus-direction-retention.png all32-direction-retention.pdf all32-direction-retention.png adamw-all48-effects.pdf adamw-all48-effects.png fixed-learning-forgetting-curves.pdf fixed-learning-forgetting-curves.png all64-local-loss-effects.pdf all64-local-loss-effects.png all64-stage-responses.pdf all64-stage-responses.png gain-scarcity-all-curves.pdf gain-scarcity-all-curves.png gain-scarcity-own-zero-effects.pdf gain-scarcity-own-zero-effects.png paradigm-all-curves.pdf paradigm-all-curves.png paradigm-operator-effects.pdf paradigm-operator-effects.png trajectory-135m-frontier.pdf trajectory-135m-frontier.png trajectory-135m-external.pdf trajectory-135m-external.png trajectory-135m-dense.pdf trajectory-135m-dense.png overfit-ordinary-controls.pdf overfit-ordinary-controls.png trajectory-135m-fresh.pdf trajectory-135m-fresh.png trajectory-360m-frontier.pdf trajectory-360m-frontier.png overfit-external-frontier.pdf overfit-external-frontier.png overfit-external-frontier-zoom.pdf overfit-external-frontier-zoom.png lookahead-three-seed-replication.pdf lookahead-three-seed-replication.png lookahead-360m-external.pdf lookahead-360m-external.png lookahead-360m-external-zoom.pdf lookahead-360m-external-zoom.png lookahead-360m-dense.pdf lookahead-360m-dense.png ordinary-lr-refinement-full.pdf ordinary-lr-refinement-full.png ordinary-lr-refinement-zoom.pdf ordinary-lr-refinement-zoom.png independent-documents.pdf independent-documents.png refined-control-seeds.pdf refined-control-seeds.png _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
