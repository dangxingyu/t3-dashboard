name: Publish T3 dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage only public website files
        run: |
          mkdir _site
          cp index.html style.css app.js data.json .nojekyll complete56-development.pdf complete56-external.pdf complete56-external.png \
            replay-own-zero.pdf replay-own-zero.png replay-trajectories.pdf replay-trajectories.png \
            small-radius-effects.pdf small-radius-effects.png small-radius-trajectories.pdf small-radius-trajectories.png \
            all96-learning-forgetting.pdf all96-learning-forgetting.png all48-strict-retention-effects.pdf all48-strict-retention-effects.png \
            focus-direction-retention.pdf focus-direction-retention.png all32-direction-retention.pdf all32-direction-retention.png adamw-all48-effects.pdf adamw-all48-effects.png fixed-learning-forgetting-curves.pdf fixed-learning-forgetting-curves.png _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
